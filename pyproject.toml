[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "henryk_media"
version = "0.1.0"
description = "Content generation and manipulation for media for Henry"
authors = [
    { name = "Konrad Jelen \u003ckonrad.jelen@gmail.com\u003e" },
]
license = "MIT"
readme = "README.md"
requires-python = "~=3.13.0"
classifiers = [
    "Programming Language :: Python :: 3",
]

dependencies = [
    "loguru",
    "tqdm",
    "typer",
    "python-dotenv",
    "botocore",
    # LivePortrait inference path (models/photo-animation/LivePortrait/requirements*.txt);
    # pins without a Python 3.13 wheel relaxed to the first release that has one
    "torch",
    "torchvision",
    "onnxruntime-gpu==1.26.0",  # last PyPI release built for CUDA 12 + cuDNN 9
    "onnx>=1.17",
    "numpy>=2.1",
    "scipy>=1.14.1",
    "scikit-image>=0.25",
    "pyyaml>=6.0.2",
    "opencv-python==4.10.0.84",
    "imageio==2.34.2",
    "imageio-ffmpeg==0.5.1",
    "pillow>=10.2.0",
    "rich==13.7.1",
    "tyro==0.8.5",
    "pykalman==0.9.7",
    "ultralytics>=8.3",
]

[project.optional-dependencies]
dev = [
    "build",
    "ipykernel",
    "ipython",
    "ipywidgets",  # rich progress bars render in Jupyter only through ipywidgets
    "nbdime",
    "pip",
    "pytest",
    "pytest-cov",
    "ruff",
    "awscli",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["henryk_media*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
src = ["src/henryk_media"]
include = ["pyproject.toml", "src/henryk_media/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["henryk_media"]
force-sort-within-sections = true
